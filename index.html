<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SwingSnap</title>
<meta name="theme-color" content="#121214">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SwingSnap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
@font-face{font-family:"Sora";font-style:normal;font-weight:600 800;font-display:swap;src:url("fonts/sora-latin.woff2") format("woff2")}
/* Same look as PuttSnap: ink #0A0504, red #C8151D only as an accent, warm white #F4F1EC. Hairline borders, rounded cards, big numerals with small units,
   bottom tab bar, accordion settings. Running screen: the whole screen is the track, the bar runs edge to edge, the text layer is turned 90 degrees. */
:root{--bg:#121214;--surface:#1b1b1e;--surface-2:#232327;--hair:rgba(244,241,236,.10);--hair-2:rgba(244,241,236,.20);--fg:#F4F1EC;--muted:#9C9692;--accent:#C8151D;--accent-hi:#CB181C;--accent-lo:#A8060A;--on-accent:#FFFFFF;--warm:#F4F1EC;--ball:84px;--r-btn:14px;--r-card:16px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Hiragino Sans","Yu Gothic",sans-serif;
  --font-display:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 70% at 50% 28%,#2a2a2e 0%,#121214 62%);color:var(--fg);font-family:var(--font);overflow:hidden;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none;cursor:default}
.ball{position:fixed;z-index:1000;pointer-events:none;top:calc(-0.5 * var(--ball));left:50%;width:var(--ball);height:var(--ball);margin-left:calc(-0.5 * var(--ball));border-radius:50%;background:#ece8e1;box-shadow:0 0 0 1px rgba(255,255,255,.10),0 12px 28px rgba(0,0,0,.8);transition:transform .12s ease-out,box-shadow .12s ease-out}
.ball svg{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:50%}
.ball.hit{transform:translateY(5px) scale(1.06);box-shadow:0 0 0 4px rgba(200,21,29,.55),0 12px 28px rgba(0,0,0,.8)}

/* ---- panel ---- */
.panel{position:fixed;inset:0;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:none;padding:calc(env(safe-area-inset-top,0px) + 14px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 96px) max(24px,env(safe-area-inset-left,0px));scrollbar-width:none}
.panel::-webkit-scrollbar{display:none}
.home,.settings,.measure{display:flex;flex-direction:column;gap:10px;flex:1;width:100%;max-width:420px;margin-inline:auto}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:46px}
.home>.mode{margin-top:6px}
.home>.arc{margin-top:auto}.home>.preview{margin-top:auto}
.home>.auto-hint{margin-top:auto}.home>.go{margin-top:-2px}.home>.auto-hint[hidden]+.go{margin-top:auto}
.measure>.go{margin-top:auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1,h2{margin:0;font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.015em}
.logo-link{display:block;align-self:flex-start;-webkit-tap-highlight-color:transparent}
.logo{display:block;height:26px;width:auto;align-self:flex-start}
.wordmark{margin:6px 0 0;align-self:flex-start;font:800 15.5px/1 var(--font-display);letter-spacing:-.02em;color:#FFFFFF;white-space:nowrap}
.tip{margin:0;font-size:14px;line-height:1.75;color:var(--muted);text-align:center;text-wrap:balance;word-break:keep-all}
.label{margin:0;font:600 11px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.msg{margin:0;min-height:1.6em;font-size:14px;font-weight:700;color:var(--warm)}
.vtitle{margin:0;font:700 28px/1.15 var(--font-display);letter-spacing:-.02em}
.settings>.head,.measure>.head{margin-top:24px}
button{-webkit-tap-highlight-color:transparent;transition:transform .4s cubic-bezier(.34,1.56,.64,1),background .18s,border-color .18s,color .18s,opacity .18s,box-shadow .18s}
button:active{transform:scale(.955);transition-duration:.09s,.18s,.18s,.18s,.18s,.18s}
button:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

/* ---- buttons ---- */
.icon-btn{width:46px;height:46px;border-radius:14px;border:1px solid var(--hair-2);background:rgba(255,255,255,.03);color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:active{background:rgba(255,255,255,.09)}
.go{width:100%;min-height:58px;border-radius:16px;border:0;background:linear-gradient(180deg,var(--accent-hi) 0%,var(--accent-lo) 100%);color:var(--on-accent);font:700 21px/1 var(--font-display);letter-spacing:.04em;cursor:pointer;box-shadow:0 12px 30px rgba(200,21,29,.32),inset 0 1px 0 rgba(255,255,255,.22)}
.go:active{transform:scale(.97);box-shadow:0 6px 18px rgba(200,21,29,.3),inset 0 1px 0 rgba(255,255,255,.18)}
.ghost{width:100%;min-height:48px;border-radius:var(--r-btn);border:1px solid var(--hair-2);background:transparent;color:var(--fg);font:600 15px var(--font);cursor:pointer}
.savebox{display:grid;grid-template-columns:1fr 96px;gap:10px}
.saveinput{min-width:0;min-height:48px;padding:0 14px;border-radius:var(--r-btn);border:1px solid var(--hair-2);background:var(--surface);color:var(--fg);font:500 15px var(--font);-webkit-user-select:text;user-select:text}
.saveinput:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.savedlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.savedlist li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.sv-use{min-width:0;min-height:52px;padding:8px 14px;border-radius:var(--r-btn);border:1px solid var(--hair-2);background:var(--surface);color:var(--fg);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.sv-use[aria-pressed="true"]{border-color:var(--accent);background:rgba(200,21,29,.14)}
.sv-use b{font:600 15px var(--font);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-use span{font:500 12px var(--font);color:var(--muted);font-variant-numeric:tabular-nums}
.sv-del{min-width:52px;min-height:52px;border-radius:var(--r-btn);border:1px solid var(--hair-2);background:transparent;color:var(--muted);font:600 13px var(--font);cursor:pointer}
.sv-empty{margin:0;font-size:13px;color:var(--muted)}
.auto-hint{margin:0;text-align:center;font:600 14px/1.4 var(--font);color:#D9D3CD;display:flex;align-items:center;justify-content:center;gap:9px;padding:2px 0;word-break:keep-all;text-wrap:balance}
.auto-hint::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px rgba(200,21,29,.9)}
@keyframes hintGlow{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(200,21,29,0)}50%{opacity:.6;box-shadow:0 0 20px 2px rgba(200,21,29,.5)}}
@media (prefers-reduced-motion:reduce){.auto-hint{animation:none}}

/* ---- segmented control with a sliding thumb ---- */
.mode,.pills{position:relative;display:flex;gap:4px;padding:4px;border:1px solid var(--hair);border-radius:16px;background:rgba(255,255,255,.025)}
.pill{white-space:nowrap;flex:1 1 0;min-height:42px;padding-inline:6px;border-radius:12px;border:0;background:transparent;color:var(--muted);font:600 14px var(--font);cursor:pointer;position:relative;z-index:1}
.pill[aria-pressed="true"]{color:#0A0504}
.seg-thumb{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:12px;background:var(--warm);z-index:0;pointer-events:none;transition:transform .28s cubic-bezier(.2,.8,.2,1),width .28s cubic-bezier(.2,.8,.2,1)}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lang-opt{min-height:48px;padding-inline:6px;border-radius:12px;border:1px solid var(--hair-2);background:transparent;color:var(--muted);font:600 14px var(--font);white-space:nowrap;cursor:pointer}
.lang-opt[aria-pressed="true"]{background:var(--warm);color:#0A0504;border-color:transparent}

/* ---- icon cards ---- */
.sounds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sounds.two{grid-template-columns:repeat(2,1fr)}
.sounds.four{grid-template-columns:repeat(4,1fr)}
.sounds.four .snd{min-height:84px;font-size:12px}
.snd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;min-height:90px;padding:10px 4px;border-radius:var(--r-card);border:1px solid var(--hair);background:var(--surface-2);color:var(--muted);font:600 13px var(--font);cursor:pointer}
.snd svg{display:block}
.snd[aria-pressed="true"]{background:rgba(200,21,29,.16);border-color:var(--accent);color:var(--fg);box-shadow:inset 0 0 22px rgba(200,21,29,.16)}
.snd small{font:500 12px/1 var(--font);color:var(--muted);margin-top:-3px;font-variant-numeric:tabular-nums}
.snd[aria-pressed="true"] small{color:var(--fg)}
.snd .num{font:600 28px/1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
@keyframes pop{0%{transform:scale(.88)}100%{transform:scale(1)}}
.snd.pop{animation:pop .36s cubic-bezier(.34,1.56,.64,1)}
.acc-note{margin:2px 2px 0;font-size:12.5px;line-height:1.65;color:var(--muted);word-break:keep-all}

/* ---- home numbers + preview ---- */
.facts2{display:flex;justify-content:center;font-variant-numeric:tabular-nums}
.fact{display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 26px}
.fl{font:600 10.5px/1 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fact strong,.stepval strong{font:600 40px/1 var(--font-display);letter-spacing:-.03em;white-space:nowrap;color:var(--warm)}
.u{margin-left:3px;font:500 14px var(--font);letter-spacing:0;color:var(--muted)}
#factTot{font-size:60px}
.splitwrap{width:100%;margin-top:2px}
.splitbar{position:relative;display:flex;gap:3px;height:12px;width:100%;margin-top:14px}
.sb-back{display:block;border-radius:6px 2px 2px 6px;background:linear-gradient(90deg,#8d1015,#E0383E);transition:flex-grow .25s}
.sb-down{display:block;border-radius:2px 6px 6px 2px;background:var(--warm);transition:flex-grow .25s}
.sb-turn{position:absolute;top:-15px;transform:translateX(-50%);font:600 10.5px/1 var(--font);letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.sb-turn::after{content:"";position:absolute;left:50%;top:12px;width:1px;height:6px;background:var(--hair-2)}
.splitlab{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font:600 13px/1.3 var(--font);color:var(--fg);font-variant-numeric:tabular-nums}
.splitlab span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.sl-back::before{background:#E0383E}.sl-down::before{background:var(--warm)}
.ratio-txt{margin-top:2px;color:var(--muted);letter-spacing:.02em;font-family:var(--font);font-weight:600;font-size:13px}
.ratio-line{margin:-6px 0 0;text-align:center;font:500 13px/1.4 var(--font-display);letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
.secs-line{margin-top:-2px;color:var(--fg)}
.preview{display:flex;align-items:center;justify-content:center;gap:14px}
.pv-phone{position:relative;flex:none;width:calc(var(--pvh,164px)*9/16);height:var(--pvh,164px);padding:5px;border-radius:20px;border:1.5px solid var(--hair-2);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));box-shadow:0 16px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
.pv-track{position:relative;width:100%;height:100%;border-radius:15px;overflow:hidden;background:#121214;transition:box-shadow .15s}
.pv-track.turn{box-shadow:inset 0 0 0 1px rgba(224,56,62,.55)}
.pv-bar{position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(180deg,#DC2229,var(--accent-lo));box-shadow:0 0 14px rgba(200,21,29,.55);will-change:transform}
.pv-bar.hit{background:var(--fg);box-shadow:0 0 14px rgba(244,241,236,.5)}
.pv-ball{position:absolute;top:-12px;left:50%;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:radial-gradient(circle at 40% 68%,#fff 0%,#ebe6de 52%,#b4ada3 100%);box-shadow:0 4px 8px rgba(0,0,0,.6);transition:transform .12s ease-out}
.pv-ball.hit{transform:translateY(2px) scale(1.14)}
.pv-turn{position:absolute;left:0;right:0;bottom:7px;padding:8px 0 3px;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 11px/1 var(--font);letter-spacing:.04em;color:var(--muted);opacity:.55;border-top:1.5px dashed var(--hair-2);transition:opacity .15s,color .15s,background .15s}.pv-turn i{font-style:normal}.pv-turn i{display:inline-block;transition:transform .2s cubic-bezier(.34,1.56,.64,1),text-shadow .2s}.pv-turn.on{opacity:1;color:#fff;border-top-color:#E0383E;border-top-style:solid;box-shadow:0 -8px 14px -8px rgba(224,56,62,.7)}.pv-turn.on i{transform:scale(1.25);text-shadow:0 0 8px rgba(224,56,62,.95),0 0 16px rgba(224,56,62,.6)}.pv-turn.on svg{color:#E0383E;animation:pvpulse .4s ease-out}@keyframes pvpulse{0%{transform:scale(.6);opacity:.3}60%{transform:scale(1.4)}100%{transform:scale(1);opacity:1}}
.pv-lab{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;font:600 12.5px/1.2 var(--font);letter-spacing:.03em;color:#CFC9C3;opacity:.8;transition:opacity .18s,color .18s;text-align:center}
.pv-lab i{font-style:normal}
.pv-lab svg{color:var(--accent)}
.pv-lab.on{opacity:1;color:#FFFFFF;font-weight:700}
.swing{position:relative;width:160px;height:100px;display:grid;place-items:center}
.sw-dot{fill:#fff;filter:drop-shadow(0 0 4px rgba(224,56,62,.95));transition:r .15s}.sw-dot.pop{r:6.5}
.swing svg{position:absolute;inset:0;width:100%;height:100%}
.golfer{position:relative;display:block;height:84px;width:auto}
.arc{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font:600 12px/1.3 var(--font);text-align:center;word-break:keep-all}
/* the home always fits one screen: fitHome() shrinks the preview phone first (164px down to 110px), then tightens the gaps, then hides the golfer */
.home.compact{gap:6px}.home.compact .topbar{min-height:38px}.home.compact .swing{height:84px}.home.small .swing{height:66px;width:106px}.home.small .golfer{height:56px}.home.small .swing svg{transform:none}.home.tiny .arc{display:none}
/* tablets: the home screen is scaled up (phones are untouched); the practice screen is a separate overlay and is not affected */
@media (min-width:700px) and (min-height:900px){.panel .home{zoom:1.35}}
@media (min-width:700px) and (max-height:899px){.panel .home{zoom:1.08}}

/* ---- tempo picker ---- */
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper .icon-btn{width:60px;height:56px;font:500 26px/1 var(--font-display)}
.stepval{display:flex;flex-direction:column;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.stepval strong{font-size:36px}
.stepval>span{color:var(--accent);font:700 12px var(--font);letter-spacing:.18em}
@keyframes tick{from{transform:scale(1.07)}to{transform:none}}
.tick{animation:tick .22s cubic-bezier(.34,1.56,.64,1)}
.card-soon{border:1px dashed var(--hair-2);border-radius:var(--r-btn);padding:14px 16px}
.card-soon h3{margin:0 0 4px;font:700 15px var(--font)}
.card-soon p{margin:0;font-size:13px;line-height:1.6;color:var(--muted);word-break:keep-all}
.card-soon .tag{display:inline-block;margin-left:6px;padding:2px 8px;border:1px solid var(--hair-2);border-radius:20px;font:600 11px var(--font);color:var(--muted);vertical-align:middle}

/* ---- settings rows (accordion) ---- */
.acc{border:1px solid var(--hair);border-radius:14px;background:var(--surface-2);overflow:hidden}
.acc-h{width:100%;min-height:58px;display:flex;align-items:center;gap:10px;padding:0 16px;background:transparent;border:0;color:var(--fg);font:600 15px var(--font);cursor:pointer;text-align:left}
.acc-t{flex:none}
.acc-lang-t{display:inline-flex;align-items:center;gap:9px}
.acc-lang-t .globe{flex:none;color:var(--accent)}
.acc-v{flex:1;min-width:0;text-align:right;color:var(--muted);font:500 13px var(--font);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{flex:none;color:var(--muted);transition:transform .18s}
.acc-h[aria-expanded="true"] .chev{transform:rotate(180deg)}
.acc-w{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.acc.open .acc-w{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1),visibility 0s 0s}
.acc-b{min-height:0;overflow:hidden}
.acc-i{display:flex;flex-direction:column;gap:12px;padding:4px 12px 16px;border-top:1px solid var(--hair)}
.acc-link{display:flex;align-items:center;gap:10px;min-height:58px;padding:0 16px;border:1px solid var(--hair);border-radius:14px;background:var(--surface-2);color:var(--fg);font:600 15px var(--font);text-decoration:none;width:100%;text-align:left;cursor:pointer}
.acc-link .acc-v{flex:1}
.rs-banner{display:block;padding:18px 16px 16px;border:1px solid var(--hair);border-radius:14px;background:var(--surface-2);color:var(--fg);text-decoration:none}
.rs-banner:active{transform:scale(.975);transition-duration:.09s}
.kicker{margin:0 0 6px;font:600 10.5px/1 var(--font-display);letter-spacing:.26em;text-transform:uppercase;color:var(--accent)}
.rs-banner .kicker{margin-bottom:10px}
.rs-banner h3{margin:0 0 6px;font:700 17px/1.35 var(--font)}
.rs-body{margin:0;font-size:13.5px;line-height:1.65;color:var(--muted);word-break:keep-all}
.rs-sign{margin:12px 0 0;font:600 12px/1.4 var(--font-display);letter-spacing:.02em;color:var(--fg)}
.rs-cta{display:flex;align-items:center;justify-content:space-between;margin-top:14px;min-height:44px;padding:0 16px;border-radius:12px;background:linear-gradient(180deg,var(--accent-hi) 0%,var(--accent-lo) 100%);color:#fff;font:700 14px var(--font)}
.fine-note{margin:0;font-size:12px;line-height:1.6;color:var(--muted);word-break:keep-all}

/* ---- tab bar ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(12px,env(safe-area-inset-left,0px));background:rgba(18,18,20,.82);-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);border-top:1px solid var(--hair)}
.tabbar-in{position:relative;display:flex;width:100%;max-width:420px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:54px;padding:6px 0 2px;background:transparent;border:0;color:var(--muted);font:600 11px/1 var(--font);letter-spacing:.02em;cursor:pointer}
.tab svg{display:block;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.tab[aria-selected="true"]{color:var(--fg)}
.tab[aria-selected="true"] svg{transform:translateY(-1px) scale(1.1)}
.tab-ind{position:absolute;top:-9px;left:0;width:30px;height:3px;border-radius:0 0 3px 3px;background:var(--accent);box-shadow:0 2px 14px rgba(200,21,29,.75);transition:transform .42s cubic-bezier(.34,1.3,.64,1)}

/* ---- guide sheet ---- */
.scrim{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.6)}
.sheet{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:30;max-width:420px;margin-inline:auto;padding:16px;border-radius:20px;background:rgba(28,22,21,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--hair-2);box-shadow:0 22px 54px rgba(0,0,0,.65);display:flex;flex-direction:column;gap:12px}
.manual{background:#202024;-webkit-backdrop-filter:none;backdrop-filter:none;z-index:45;top:calc(env(safe-area-inset-top,0px) + 64px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);max-width:560px;gap:12px;overflow:hidden}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.howto-title{font:700 20px/1.2 var(--font-display)}
.sheet-x{width:40px;height:40px;border-radius:12px;border:1px solid var(--hair-2);background:transparent;color:var(--fg);font:500 20px/1 var(--font);cursor:pointer;flex:none}
.man-quick{display:flex;flex-direction:column;gap:12px;padding:2px 2px 14px;margin-bottom:6px;border-bottom:1px solid var(--hair)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:flex;gap:12px;align-items:flex-start;font:400 14px/1.6 var(--font);color:var(--fg);word-break:keep-all}
.steps i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--font-display);font-style:normal;color:var(--fg);background:rgba(200,21,29,.22);border:1px solid var(--accent);margin-top:1px}
.man-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.acc-i .man-beats{margin:12px 0 4px;background:rgba(255,255,255,.02)}
.man-beats{border:1px solid var(--hair);border-radius:14px;background:rgba(255,255,255,.03);padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.mb-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mb-head strong{font:700 15px/1.35 var(--font);word-break:keep-all}
.mb-seg{display:flex;flex:none;border:1px solid var(--hair-2);border-radius:10px;overflow:hidden}
.mb-seg button{min-height:34px;padding:0 12px;border:0;background:transparent;color:var(--muted);font:600 13px var(--font);white-space:nowrap}
.mb-seg button[aria-pressed="true"]{background:var(--warm);color:#121214}
.mb-stage{position:relative;height:104px}
.mb-plot{position:absolute;left:40px;right:40px;top:0;bottom:0}
.mb-bar{position:absolute;left:0;right:0;top:24px;height:10px;display:flex;border-radius:5px;overflow:hidden}
.mb-bar .b{display:block;background:linear-gradient(90deg,#8d1015,#E0383E)}
.mb-bar .d{display:block;background:var(--warm);border-left:2px solid #121214}
.mb-pt{position:absolute;top:0;bottom:0;width:0}
.mb-pt>*{position:absolute;left:0;transform:translateX(-50%)}
.mb-lab{font:600 11.5px/1.2 var(--font);color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.mb-lab.up{top:0}.mb-lab.dn{top:84px}
.mb-dot{top:23px;width:12px;height:12px;margin-top:0;border-radius:50%;background:var(--bg);border:2px solid var(--warm);transition:transform .15s,background .15s}
.mb-spk{top:46px;color:var(--warm);transition:opacity .2s}
.mb-spk svg{display:block;width:24px;height:24px}
.mb-spk .sl{opacity:0}
.mb-pt.mute .mb-spk{opacity:.4;color:var(--muted)}
.mb-pt.mute .mb-spk .sl{opacity:1}
.mb-pt.mute .mb-spk .w1,.mb-pt.mute .mb-spk .w2{opacity:0}
.mb-ring{top:44px;width:28px;height:28px;margin-top:-2px;border-radius:50%;border:2px solid #E0383E;opacity:0;pointer-events:none}
.mb-pt.mute .mb-ring{display:none}
.mb-pt.hit .mb-ring{animation:mbring .55s ease-out}
.mb-pt.hit .mb-dot{animation:mbdot .5s ease-out}
.mb-pt.hit .mb-spk{animation:mbspk .5s ease-out}
.mb-mark{position:absolute;top:29px;left:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(224,56,62,.95);pointer-events:none}
@keyframes mbring{0%{opacity:.85;transform:translateX(-50%) scale(.6)}100%{opacity:0;transform:translateX(-50%) scale(1.9)}}
@keyframes mbdot{0%{background:#E0383E;transform:translateX(-50%) scale(1.7)}100%{background:var(--bg);transform:translateX(-50%) scale(1)}}
@keyframes mbspk{0%{color:#fff;transform:translateX(-50%) scale(1.25)}100%{transform:translateX(-50%) scale(1)}}
.mb-cap{margin:0;min-height:5.4em;font:400 13.5px/1.7 var(--font);color:var(--fg);word-break:keep-all}
.mb-play{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:12px;border:1px solid var(--hair-2);background:rgba(255,255,255,.04);color:var(--fg);font:600 14px var(--font)}
.mb-play svg{width:18px;height:18px}
.mb-play:disabled{opacity:.55}
@media (prefers-reduced-motion:reduce){.mb-pt.hit .mb-ring,.mb-pt.hit .mb-dot,.mb-pt.hit .mb-spk{animation:none}}
.man-body details{border:1px solid var(--hair);border-radius:14px;background:rgba(255,255,255,.03)}
.man-body summary{list-style:none;cursor:pointer;padding:14px 16px;font:700 15px/1.4 var(--font);display:flex;align-items:center;gap:12px;word-break:keep-all}
.man-body summary::-webkit-details-marker{display:none}
.man-body summary::after{content:"+";margin-left:auto;flex:none;font:500 20px/1 var(--font);color:var(--muted)}
.man-body details[open] summary::after{content:"\2212"}
.man-body details[open] summary{color:var(--warm)}
.man-c{padding:0 16px 14px;font:400 14px/1.75 var(--font);color:var(--fg);word-break:keep-all}

/* ---- splash ---- */
.splash{position:fixed;inset:0;z-index:3000;background:#121214;display:grid;place-items:center}
.splash img{height:36px;width:auto;animation:splashIn .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes splashIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}

/* ---- running screen ---- */
#run{position:fixed;inset:0;z-index:40;display:none;overflow:hidden;background:radial-gradient(120% 70% at 50% 28%,#2a2a2e 0%,#121214 62%)}
#run.on{display:block}
.bar{position:absolute;left:0;right:0;top:0;height:14px;background:linear-gradient(180deg,#DC2229 0%,var(--accent-lo) 100%);box-shadow:0 0 26px rgba(200,21,29,.5);will-change:transform;z-index:2}
.bar.hit{background:var(--fg);box-shadow:0 0 26px rgba(244,241,236,.5)}
.cue{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;box-shadow:inset 0 0 130px 46px rgba(200,21,29,.95)}
.lights{position:absolute;z-index:4;left:20%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:16px;pointer-events:none;opacity:0;transition:opacity .3s ease}
.lights.show{opacity:1}
.lights i{width:30px;height:30px;border-radius:50%;box-sizing:border-box;border:1.5px solid rgba(244,241,236,.22);background:transparent;transition:background .12s,border-color .12s}
.lights .r.on{background:#E0383E;border-color:#E0383E}
.lights .y.on{background:#E9B520;border-color:#E9B520}
.lights .g.on{background:#33B868;border-color:#33B868}
.rot{position:absolute;left:0;top:0;width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg);z-index:3;pointer-events:none}
.rlogo{position:absolute;left:46px;top:18px;height:20px;width:auto;opacity:.9}
#stop{position:absolute;right:18px;top:12px;pointer-events:auto;width:auto;min-height:44px;padding:0 14px;border:0;background:transparent;box-shadow:none;color:var(--muted);font:500 13px/1.3 var(--font);letter-spacing:0;opacity:.32}

/* ---- Japanese / Chinese: break between characters ---- */
html:lang(ja) *{word-break:normal!important;overflow-wrap:anywhere;line-break:strict}
</style>
</head>
<body>
<div id="splash" class="splash" aria-hidden="true"><img alt="" src="img/redstick-logo-for-black-bg.png"></div>

<main id="panel" class="panel">
  <!-- PRACTICE -->
  <div id="home" class="home">
    <div class="topbar">
      <a id="logoLink" class="logo-link" href="https://www.amazon.com/dp/B0FZKSFRWL" target="_blank" rel="noopener" aria-label="Redstick"><img class="logo" src="img/redstick-logo-for-black-bg.png" alt="redstick"></a>
      <p class="wordmark" aria-label="SwingSnap">SwingSnap</p>
    </div>
    <div class="mode" id="levels" role="group" aria-label="pace">
      <button class="pill" type="button" data-level="0" aria-pressed="false"><span data-t="lv_gen"></span></button>
      <button class="pill" type="button" data-level="1" aria-pressed="false"><span data-t="lv_adv"></span></button>
      <button class="pill" type="button" data-level="2" aria-pressed="false"><span data-t="lv_pro"></span></button>
    </div>
    <div class="arc" aria-hidden="true">
      <div class="swing">
        <svg viewBox="0 0 160 100" fill="none" stroke-linecap="round" aria-hidden="true">
          <defs><linearGradient id="dsw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C8151D" stop-opacity=".15"/><stop offset="1" stop-color="#E0383E"/></linearGradient></defs>
          <path id="swp" d="M56 16 C6 26 22 96 79 87.8" stroke="url(#dsw)" stroke-width="3" opacity=".55"/>
          <path id="swTrail" d="M56 16 C6 26 22 96 79 87.8" stroke="#E0383E" stroke-width="3.6" stroke-dasharray="0 400"/>
          <circle id="swDot" class="sw-dot" r="4.2" cx="79" cy="87.8"/>
        </svg>
        <img class="golfer" src="img/golfer.png" alt="" height="84">
      </div>
    </div>
    <div class="preview" aria-hidden="true">
      <span id="pvBack" class="pv-lab"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg><i data-t="back"></i></span>
      <div class="pv-phone"><div id="pvTrack" class="pv-track"><div id="pvBar" class="pv-bar"></div><div id="pvBall" class="pv-ball"></div><div id="pvTurn" class="pv-turn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 8l4-4 4 4M12 4v16M8 16l4 4 4-4"/></svg><i data-t="turn"></i></div></div></div>
      <span id="pvFwd" class="pv-lab"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg><i data-t="down"></i></span>
    </div>
    <div class="facts2"><div class="fact"><span class="fl" data-t="totL"></span><div><strong id="factTot">1.30</strong><span class="u" data-t="sec"></span></div></div></div>
    <div class="splitwrap" id="splitWrap" aria-hidden="true"><div class="splitbar"><i class="sb-back" id="sbBack"></i><i class="sb-down" id="sbDown"></i><span class="sb-turn" id="sbTurn"></span></div><div class="splitlab"><span class="sl-back" id="sbBackT"></span><span class="sl-down" id="sbDownT"></span></div></div>
    <p class="ratio-line ratio-txt" id="factRatio"></p>
    <p id="autoHint" class="auto-hint" hidden></p>
    <button id="go" class="go" type="button" data-t="start"></button>
  </div>

  <!-- MAKE MY TEMPO -->
  <div id="measure" class="measure" hidden>
    <div class="head"><h1 class="vtitle" data-t="makeH"></h1></div>
    <p class="label" data-t="quick"></p>
    <div class="sounds" role="group" aria-label="pace">
      <button class="snd" type="button" data-preset="0"><svg viewBox="0 0 40 40" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 30a14 14 0 0 1 28 0"/><path d="M20 30 11 17"/><circle cx="20" cy="30" r="2" fill="currentColor"/><path d="M10 14l1 1M20 9v2M30 14l-1 1"/></svg><span data-t="lv_gen"></span><small>1.30</small></button>
      <button class="snd" type="button" data-preset="1"><svg viewBox="0 0 40 40" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 30a14 14 0 0 1 28 0"/><path d="M20 30 20 17"/><circle cx="20" cy="30" r="2" fill="currentColor"/><path d="M10 14l1 1M20 9v2M30 14l-1 1"/></svg><span data-t="lv_adv"></span><small>1.15</small></button>
      <button class="snd" type="button" data-preset="2"><svg viewBox="0 0 40 40" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 30a14 14 0 0 1 28 0"/><path d="M20 30 29 17"/><circle cx="20" cy="30" r="2" fill="currentColor"/><path d="M10 14l1 1M20 9v2M30 14l-1 1"/></svg><span data-t="lv_pro"></span><small>1.00</small></button>
    </div>
    <p class="label" data-t="totL"></p>
    <div class="stepper">
      <button id="tMinus" class="icon-btn" type="button" aria-label="-0.01">&minus;</button>
      <div class="stepval"><strong id="draftTot"></strong><span id="draftSplit"></span></div>
      <button id="tPlus" class="icon-btn" type="button" aria-label="+0.01">+</button>
    </div>
    <p class="fine-note" data-t="totP"></p>
    <p class="label" data-t="ratioL"></p>
    <div class="stepper">
      <button id="rMinus" class="icon-btn" type="button" aria-label="-0.1">&minus;</button>
      <div class="stepval"><strong id="draftRatio"></strong><span data-t="back"></span></div>
      <button id="rPlus" class="icon-btn" type="button" aria-label="+0.1">+</button>
    </div>
    <p class="fine-note" data-t="ratioP"></p>
    <div class="savebox">
      <input id="saveName" class="saveinput" type="text" maxlength="20" autocomplete="off">
      <button id="saveAdd" class="ghost" type="button" data-t="saveBtn"></button>
    </div>
    <p id="saveMsg" class="msg" aria-live="polite"></p>
    <p class="label"><span data-t="savedTitle"></span> <span id="savedCount"></span></p>
    <ul id="savedList" class="savedlist"></ul>
    <div class="card-soon"><h3><span data-t="filmH"></span><span class="tag" data-t="soon"></span></h3><p data-t="filmP"></p></div>
    <button id="practiceBtn" class="go" type="button" data-t="practice"></button>
  </div>

  <!-- SETTINGS -->
  <div id="settings" class="settings" hidden>
    <div class="head"><h1 class="vtitle" data-t="settingsTitle"></h1></div>

    <section class="acc">
      <button class="acc-h" type="button" aria-expanded="false" aria-controls="acc-lang"><span class="acc-t acc-lang-t"><svg class="globe" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3z"/></svg><span data-t="langT"></span></span><span class="acc-v" id="accv-lang"></span><svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="acc-w" id="acc-lang"><div class="acc-b"><div class="acc-i">
        <div class="langs" role="group" aria-label="language">
          <button class="lang-opt" type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
          <button class="lang-opt" type="button" data-lang="ja" lang="ja" aria-pressed="false">日本語</button>
          <button class="lang-opt" type="button" data-lang="ko" lang="ko" aria-pressed="false">한국어</button>
          <button class="lang-opt" type="button" data-lang="zh" lang="zh-Hans" aria-pressed="false">中文</button>
          <button class="lang-opt" type="button" data-lang="es" lang="es" aria-pressed="false">Español</button>
          <button class="lang-opt" type="button" data-lang="de" lang="de" aria-pressed="false">Deutsch</button>
        </div>
      </div></div></div>
    </section>

    <section class="acc">
      <button class="acc-h" type="button" aria-expanded="false" aria-controls="acc-sound"><span class="acc-t acc-lang-t"><svg class="globe" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.6v6.8h4.2L13.4 21V3L7.2 8.6z"/><path d="M16.8 8.4a5.2 5.2 0 0 1 0 7.2"/><path d="M19.8 5.4a9.4 9.4 0 0 1 0 13.2"/></svg><span data-t="soundT"></span></span><span class="acc-v" id="accv-sound"></span><svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="acc-w" id="acc-sound"><div class="acc-b"><div class="acc-i">
        <div class="sounds" role="group" aria-label="sound">
          <button class="snd" type="button" data-sound="metronome" aria-pressed="false"><svg viewBox="0 0 40 40" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 35 16 6h8l6 29z"/><path d="M20 30 28 11"/><circle cx="28.500" cy="10" r="3" fill="currentColor"/><path d="M7 35h26"/></svg><span data-t="s_metronome"></span></button>
          <button class="snd" type="button" data-sound="digital" aria-pressed="false"><svg viewBox="0 0 40 40" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="20" cy="23" r="12"/><path d="M20 23v-7"/><path d="M16 6h8"/><path d="M20 6v5"/></svg><span data-t="s_digital"></span></button>
          <button class="snd" type="button" data-sound="deskbell" aria-pressed="false"><svg viewBox="0 0 40 40" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 27a12 12 0 0 1 24 0z"/><path d="M5 31h30"/><path d="M20 12v3M17 11h6"/></svg><span data-t="s_deskbell"></span></button>
          <button class="snd" type="button" data-sound="snap" aria-pressed="false"><svg viewBox="0 0 40 40" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6v6M10 12l4 4M30 12l-4 4M5 24h6M29 24h6"/><circle cx="20" cy="24" r="4.500" fill="currentColor" stroke="none"/><path d="M14 35c2-3 10-3 12 0" opacity="0.5"/></svg><span data-t="s_snap"></span></button>
          <button class="snd" type="button" data-sound="marimba" aria-pressed="false"><svg viewBox="0 0 40 40" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="9" width="28" height="6" rx="2"/><rect x="9" y="18" width="22" height="6" rx="2"/><rect x="12" y="27" width="16" height="6" rx="2"/></svg><span data-t="s_marimba"></span></button>
          <button class="snd" type="button" data-sound="wood" aria-pressed="false"><svg viewBox="0 0 40 40" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="19" width="26" height="14" rx="5"/><path d="M12 25h5M21 25h5M12 29h8"/><path d="M33 5 22 16"/><circle cx="34" cy="4.500" r="2.600" fill="currentColor"/></svg><span data-t="s_wood"></span></button>
        </div>
      </div></div></div>
    </section>

    <section class="acc">
      <button class="acc-h" type="button" aria-expanded="false" aria-controls="acc-cue"><span class="acc-t acc-lang-t"><svg class="globe" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><span data-t="cueT"></span></span><span class="acc-v" id="accv-cue"></span><svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="acc-w" id="acc-cue"><div class="acc-b"><div class="acc-i">
        <div class="sounds two" role="group" aria-label="cue pattern">
          <button class="snd" type="button" data-cue="2" aria-pressed="false"><svg viewBox="0 0 40 40" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="3.5" fill="currentColor"/><circle cx="31" cy="20" r="3.5" fill="currentColor"/><path d="M15 20h10" stroke-dasharray="1 5"/></svg><span data-t="c2"></span></button>
          <button class="snd" type="button" data-cue="3" aria-pressed="false"><svg viewBox="0 0 40 40" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="20" r="3.3" fill="currentColor"/><circle cx="20" cy="20" r="3.3" fill="currentColor"/><circle cx="34" cy="20" r="3.3" fill="currentColor"/></svg><span data-t="c3"></span></button>
        </div>
        <div id="cueBeats"></div>
        <p class="acc-note" data-t="cueP"></p>
      </div></div></div>
    </section>

    <section class="acc">
      <button class="acc-h" type="button" aria-expanded="false" aria-controls="acc-int"><span class="acc-t acc-lang-t"><svg class="globe" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13.3" r="8"/><path d="M12 9v4.6l3 1.8"/><path d="M9.5 2.8h5"/></svg><span data-t="intT"></span></span><span class="acc-v" id="accv-int"></span><svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="acc-w" id="acc-int"><div class="acc-b"><div class="acc-i">

 m:[['What is tempo?','Tempo is how a swing is timed: how long it takes from the start of the swing to impact, and how that time splits between backswing and downswing.'],
 ['Total time and ratio','Total 1.30 s with a 3:1 ratio means about 0.98 s backswing and 0.33 s downswing. The ratio only says how the time is shared.'],
 ['Where does it start and end?','Here, the backswing runs from takeaway to the top, and the downswing from the top to impact. Other studies and apps use other definitions, so numbers cannot be compared directly.'],
 ['Is 3:1 the right ratio?','No. It is a commonly used reference. In measurements of elite players the ratio ranged roughly from 2.4 to 3.4, and it differs between studies and methods.'],
 ['Is faster better?','No. In one study the player with the fastest downswing did not have the highest clubhead speed. Use a pace you can repeat comfortably.'],
 ['Does tempo change by club?','In small studies of skilled players, total time and downswing time were about the same across driver, irons and wedges. So this app has one setting for all clubs; change it if you swing differently.'],

 qTitle:'使い方',
 q:['スマホを床に平らに置くか、クラブが届かない場所に立ててください。音量を上げましょう。','スタートを押すか、スマホを平らに置くと自動で始まります。持ち上げると止まります。','リズムを聞きます：始動・トップ・インパクトで音が鳴ります（設定で2拍にすると始動とインパクトだけ）。最後の音にぴったり合わせる必要はありません。','信号機を見ます：赤、黄、そして緑。緑になった瞬間に次のスイングが始まります。'],
 m:[['テンポとは？','スイングの時間配分です。始動からインパクトまでの時間と、それがバックスイングとダウンスイングにどう分かれるかを指します。'],
 ['合計時間と比率','合計1.30秒で比率3:1なら、バックスイング約0.98秒、ダウンスイング約0.33秒です。比率は時間の分け方だけを示します。'],
 ['どこからどこまで？','このアプリでは、バックスイングは始動〜トップ、ダウンスイングはトップ〜インパクトです。研究や他のアプリは定義が違うため、数字をそのまま比べられません。'],
 ['3:1が正解？','いいえ。よく使われる目安です。上級者の測定では比はおよそ2.4〜3.4にばらつき、研究や方法で異なります。'],
 ['速いほどいい？','いいえ。ある研究では、ダウンスイングが最も速い選手のヘッドスピードが最速というわけではありませんでした。楽に繰り返せるペースで練習しましょう。'],
 ['クラブで変わる？','上級者の小規模な研究では、ドライバー・アイアン・ウェッジで合計時間とダウンスイング時間はほぼ同じでした。そのためこのアプリはクラブの区別なく設定を1つだけ使い、違うペースで打ちたいときは自分で変えます。'],
 ['できること・できないこと','一定の練習用リズムを鳴らします。スイングの測定や判定はせず、飛距離や精度の向上は約束しません。'],
 ['安全','クラブが当たらない場所に置き、無理せず、痛みがあれば中止してください。医学的助言ではありません。']]},

 q:['把手机平放在地上，或者立在球杆碰不到的地方，并调大音量。','点“开始”，或者直接把手机平放，它会自动开始；拿起手机就会停止。','跟着节奏挥杆：起杆、上杆顶点和击球时各有一声（在设置里选 2 拍则只在起杆和击球时响）。不必和最后一声分毫不差。','看信号灯：红、黄、绿。绿灯一亮，下一次挥杆开始。'],

 ['3:1 就是标准答案吗？','不是，它只是常用的参考值。对高水平球员的测量显示，比例大约在 2.4 到 3.4 之间，不同研究、不同方法的结果也不一样。'],
 ['越快越好吗？','不是。有研究发现，下杆最快的球员杆头速度并不是最快的。请用自己能轻松重复的节奏练习。'],
 ['换球杆节奏会变吗？','针对高水平球员的小样本研究发现，一号木、铁杆和挖起杆的总时长和下杆时间几乎一样。所以本应用所有球杆共用一个设置；如果你的打法不同，可以自己调整。'],

 ['安全提示','把手机放在挥杆路线之外，量力而行，如有疼痛请停止。本应用不提供医疗建议。']]},

 q:['Deja el teléfono plano en el suelo, o apóyalo donde el palo no llegue. Sube el volumen.','Pulsa Empezar o simplemente deja el teléfono plano: arranca solo. Levántalo para parar.','Sigue el ritmo: suena al inicio, en el top y en el impacto (con 2 sonidos en Ajustes, solo al inicio y en el impacto). No hace falta acertar justo en el último sonido.','Mira el semáforo: rojo, amarillo y verde. Con el verde arranca el siguiente swing.'],
 m:[['¿Qué es el tempo?','Es cómo se reparte el tiempo en tu swing: cuánto tardas desde el inicio hasta el impacto y cómo se divide ese tiempo entre la subida (backswing) y la bajada (downswing).'],
 ['Tiempo total y proporción','Con un total de 1.30 s y proporción 3:1, la subida dura unos 0.98 s y la bajada unos 0.33 s. La proporción solo indica cómo se reparte el tiempo.'],
 ['¿Desde dónde hasta dónde?','En esta app, la subida va del inicio del swing al top, y la bajada, del top al impacto. Otros estudios y otras apps lo definen de otra manera, así que las cifras no se pueden comparar directamente.'],
 ['¿El 3:1 es lo correcto?','No. Es solo una referencia habitual. En mediciones con jugadores de alto nivel, la proporción iba aproximadamente de 2.4 a 3.4, y cambia según el estudio y el método.'],
 ['¿Cuanto más rápido, mejor?','No. En un estudio, el jugador con la bajada más rápida no era el que tenía más velocidad de cabeza de palo. Usa un ritmo que puedas repetir con comodidad.'],
 ['¿Cambia el tempo con cada palo?','En estudios pequeños con jugadores de buen nivel, el tiempo total y el de la bajada fueron casi iguales con driver, hierros y wedges. Por eso la app usa un único ajuste para todos los palos; cámbialo si tu swing es distinto.'],
 ['Qué hace y qué no hace esta app','Reproduce un ritmo constante para practicar. No mide ni evalúa tu swing, y no promete más distancia ni más precisión.'],
 ['Seguridad','Deja el teléfono fuera de la trayectoria del palo, tómatelo con calma y para si notas dolor. Esto no es un consejo médico.']]},

 ['Von wo bis wo wird gemessen?','In dieser App reicht der Rückschwung vom Schwungbeginn bis zum Umkehrpunkt und der Abschwung vom Umkehrpunkt bis zum Treffmoment. Andere Studien und Apps definieren das anders, deshalb lassen sich die Zahlen nicht direkt vergleichen.'],

var $=function(i){return document.getElementById(i)};
var LEVELS=[1.30,1.15,1.00];
var SOUNDS=['metronome','wood','deskbell','marimba','snap','digital'];
var INTS=[0,3,5,8];
var S={lang:null,tempo:{tot:1.30,ratio:3},sound:'metronome',cue:3,interval:3,flash:'on',seen:false};
try{var sv=JSON.parse(localStorage.getItem('swingsnap')||'{}');for(var k in sv){if(k!=='clubs'&&k!=='club'&&k!=='auto')S[k]=sv[k]}if(!sv.tempo&&sv.clubs){var oc=sv.clubs[sv.club]||sv.clubs.iron;if(oc&&oc.tot&&oc.ratio)S.tempo={tot:oc.tot,ratio:oc.ratio}}}catch(e){}
if(SOUNDS.indexOf(S.sound)<0)S.sound='metronome';
if(INTS.indexOf(S.interval)<0)S.interval=INTS.reduce(function(a,b){return Math.abs(b-S.interval)<Math.abs(a-S.interval)?b:a});
if(!S.tempo||!(S.tempo.tot>=0.9&&S.tempo.tot<=1.5)||!(S.tempo.ratio>=2&&S.tempo.ratio<=4))S.tempo={tot:1.30,ratio:3};
if(!I18N[S.lang]){var nl=(navigator.language||'en').slice(0,2);S.lang=I18N[nl]?nl:'en'}
function save(){try{localStorage.setItem('swingsnap',JSON.stringify(S))}catch(e){}}
function t(k){return (I18N[S.lang]||I18N.en)[k]||I18N.en[k]||k}
function cur(){return S.tempo}
function bsplit(c){var b=c.tot*c.ratio/(c.ratio+1);return {b:b,d:c.tot-b}}
function fmtR(r){return r.toFixed(1)}
function dc(v){return String(v)}
function fmtS(x){var u=t('sec');return dc(x.toFixed(2))+(/[a-z]/i.test(u)?' ':'')+u}
function fmtN(r){return dc(Math.abs(r-Math.round(r))<0.005?String(Math.round(r)):r.toFixed(1))}
var running=false,curView='home';

/* ---------- render ---------- */
function setPressed(sel,fn){[].forEach.call(document.querySelectorAll(sel),function(b){b.setAttribute('aria-pressed',String(fn(b)))})}
function render(){
  document.documentElement.lang=S.lang;
  [].forEach.call(document.querySelectorAll('[data-t]'),function(n){n.textContent=t(n.getAttribute('data-t'))});
  var c=cur(),p=bsplit(c);
  $('factTot').textContent=dc(c.tot.toFixed(2));
  var ratioN=fmtN(c.ratio);
  $('sbBack').style.flexGrow=c.ratio;$('sbDown').style.flexGrow=1;
  $('sbBackT').textContent=t('back')+' '+fmtS(p.b);$('sbDownT').textContent=t('down')+' '+fmtS(p.d);

    if(tilt>20||dev>4){liftCount++;if(liftCount>=3){liftCount=0;end()}}else liftCount=0;
    return;
  }
  if(tilt>20){armed=true;flatSince=0;return}
  var visible=curView==='home'&&manualEl.hidden;
  if(!armed||!visible){flatSince=0;return}
  if(tilt<8&&dev<0.9){var n2=performance.now();if(!flatSince)flatSince=n2;else if(n2-flatSince>1000){flatSince=0;armed=false;begin()}}else flatSince=0;
}
function bindMotion(){if(motionBound)return;motionBound=true;window.addEventListener('devicemotion',onMotion)}
if(typeof DeviceMotionEvent!=='undefined'){bindMotion();if(needsPerm())document.addEventListener('pointerdown',function(){DeviceMotionEvent.requestPermission().then(function(){},function(){})},{once:true})}
window.__swingsnap={onMotion:onMotion,bufs:bufs};


/* ---------- the home always fits one screen (text is never scaled down) ---------- */
function fitHome(){
  var homeEl=$('home'),pn=$('panel'),go=$('go');
  if(!homeEl||!pn||!go||homeEl.hidden||curView!=='home')return;
  function limit(){return pn.getBoundingClientRect().top+pn.clientHeight-parseFloat(getComputedStyle(pn).paddingBottom)}
  function overBy(){return go.getBoundingClientRect().bottom-limit()}
  function sizePhone(){
    homeEl.style.removeProperty('--pvh');
    var over=overBy();
    if(over<=0.5)return true;
    homeEl.style.setProperty('--pvh',Math.max(110,164-Math.ceil(over))+'px');
    return overBy()<=0.5;
  }
  var ah=$('autoHint');   // only when the full sentence would wrap (small screens) use the short one
  if(ah&&!ah.hidden){ah.textContent=t('autoHint');if(ah.getBoundingClientRect().height>parseFloat(getComputedStyle(ah).lineHeight||0)*1.5+4)ah.textContent=t('autoHintS')}
  homeEl.classList.remove('compact','small','tiny');
  if(sizePhone())return;
  homeEl.classList.add('compact');
  if(sizePhone())return;
  homeEl.classList.add('small');
  if(sizePhone())return;
  homeEl.classList.add('tiny');sizePhone();
}
var _render=render;render=function(){_render.apply(this,arguments);fitHome();if(typeof cueBeatsKick==='function')cueBeatsKick()};
window.addEventListener('resize',function(){requestAnimationFrame(fitHome)});requestAnimationFrame(function(){requestAnimationFrame(fitHome)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitHome);
/* ---------- home preview: the bar moves at the chosen tempo ---------- */
var pvBar=$('pvBar'),pvTrack=$('pvTrack'),pvBall=$('pvBall'),pvBackEl=$('pvBack'),swP=$('swp'),swTrail=$('swTrail'),swDot=$('swDot'),swL=0,pvTurnEl=$('pvTurn'),pvFwdEl=$('pvFwd'),pvRaf=0,pvT0=0;
var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function ease(x){return x<0.5?2*x*x:1-Math.pow(-2*x+2,2)/2}
function pvOn(){return curView==='home'&&!running&&!document.hidden&&!reduced&&$('manual').hidden}
function pvFrame(ts){
  if(!pvOn()){pvRaf=0;return}
  var c=cur(),sp=bsplit(c),cyc=c.tot+1.0,tt=((ts-pvT0)/1000)%cyc,y=0,hit=false,ph='';
  if(tt<sp.b){y=ease(tt/sp.b);ph='b'}else if(tt<c.tot){y=1-ease((tt-sp.b)/sp.d);ph='f'}else{y=0;hit=tt<c.tot+0.18}
  var travel=pvTrack.clientHeight-pvBar.offsetHeight;
  pvBar.style.transform='translateY('+(y*travel)+'px)';
  pvBar.classList.toggle('hit',hit);pvBall.classList.toggle('hit',hit);
  pvTrack.classList.toggle('turn',tt>=sp.b&&tt<sp.b+0.16);pvTurnEl.classList.toggle('on',tt>=sp.b-0.05&&tt<sp.b+0.4);
  pvBackEl.classList.toggle('on',ph==='b');pvFwdEl.classList.toggle('on',ph==='f');
  if(!swL)swL=swP.getTotalLength();
  var pos=ph==='b'?swL*(1-ease(tt/sp.b)):ph==='f'?swL*ease((tt-sp.b)/sp.d):swL,pt=swP.getPointAtLength(pos),tl=26,st=ph==='b'?pos:Math.max(0,pos-tl),ln=ph==='b'?Math.min(tl,swL-pos):Math.min(tl,pos);
  swDot.setAttribute('cx',pt.x);swDot.setAttribute('cy',pt.y);swDot.classList.toggle('pop',tt>=sp.b-0.05&&tt<sp.b+0.4);
  swTrail.style.strokeDasharray=ph===''?'0 400':ln+' 400';swTrail.style.strokeDashoffset=-st;
  pvRaf=requestAnimationFrame(pvFrame);
}
function pvStart(){if(pvRaf||!pvOn())return;pvT0=performance.now();pvRaf=requestAnimationFrame(pvFrame)}
document.addEventListener('visibilitychange',function(){if(!document.hidden)pvStart()});

/* ---------- clicks: pick things ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('button');if(!b)return;
  var c=cur(),a;
  if((a=b.getAttribute('data-level'))!==null||(a=b.getAttribute('data-preset'))!==null){c.tot=LEVELS[+a];c.ratio=3;save();render()}
  else if(b.hasAttribute('data-sound')){S.sound=b.getAttribute('data-sound');save();render();preview()}
  else if(b.hasAttribute('data-cue')){S.cue=+b.getAttribute('data-cue');save();render();preview()}
  else if(b.hasAttribute('data-int')){S.interval=+b.getAttribute('data-int');save();render()}
  else if(b.hasAttribute('data-flash')){S.flash=b.getAttribute('data-flash');save();render();if(S.flash==='on'){var cu=$('cue');if(cu.animate)cu.animate([{opacity:1},{opacity:0}],{duration:460,easing:'ease-out'})}}
  else if(b.hasAttribute('data-lang')){S.lang=b.getAttribute('data-lang');save();render()}
  var cd=e.target.closest&&e.target.closest('.snd');if(cd){cd.classList.remove('pop');void cd.offsetWidth;cd.classList.add('pop')}
});
document.addEventListener('pointerdown',function(){ctx();loadSounds()},{once:true});

/* ---------- golf ball (~400 dimples on a sphere, same as PuttSnap) ---------- */
(function buildBall(){
  var N=400,DR=0.04,tilt=0.5,out=[];
  for(var i=0;i<N;i++){
    var y0=1-2*(i+0.5)/N,rr=Math.sqrt(1-y0*y0),th=i*2.399963,x=Math.cos(th)*rr,y1=y0,z1=Math.sin(th)*rr;
    var y=y1*Math.cos(tilt)-z1*Math.sin(tilt),z=y1*Math.sin(tilt)+z1*Math.cos(tilt);
    if(z<0.1)continue;
    var sy=-y,ang=Math.atan2(sy,x)*180/Math.PI,rx=(DR*Math.max(z,0.15)).toFixed(4),ry=DR.toFixed(4);
    var g='translate('+x.toFixed(4)+' '+sy.toFixed(4)+') rotate('+ang.toFixed(1)+')';
    var gl='translate('+(x+0.011).toFixed(4)+' '+(sy+0.011).toFixed(4)+') rotate('+ang.toFixed(1)+')';
    out.push('<ellipse transform="'+gl+'" rx="'+rx+'" ry="'+ry+'" fill="#fff" opacity="0.75"/>');
    out.push('<ellipse transform="'+g+'" rx="'+rx+'" ry="'+ry+'" fill="#6b5f52" opacity="'+(0.16+0.1*z).toFixed(2)+'"/>');
  }
  var svg='<svg viewBox="-1 -1 2 2" aria-hidden="true"><defs>'+
   '<radialGradient id="bBase" cx="0.4" cy="0.62" r="0.85"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#f5f1ea"/><stop offset="0.8" stop-color="#d8d1c6"/><stop offset="1" stop-color="#a39a8d"/></radialGradient>'+
   '<radialGradient id="bShade" cx="0.4" cy="0.58" r="0.62"><stop offset="0.55" stop-color="#2a1f14" stop-opacity="0"/><stop offset="1" stop-color="#2a1f14" stop-opacity="0.5"/></radialGradient>'+
   '<radialGradient id="bSpec" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>'+
   '</defs><circle r="1" fill="url(#bBase)"/>'+out.join('')+'<circle r="1" fill="url(#bShade)"/>'+
   '<ellipse cx="-0.3" cy="0.32" rx="0.26" ry="0.12" transform="rotate(-24 -0.3 0.32)" fill="url(#bSpec)"/></svg>';
  $('ball').insertAdjacentHTML('afterbegin',svg);
})();
